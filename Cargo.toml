[workspace]
members = [
    "crates/grpc-core",
    "crates/grpc-codec/prost",
    "crates/grpc-codec/fory",
    "crates/grpc-codec/capnp",
    "crates/grpc-macros",
    "crates/grpc-build",
    "crates/grpc",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
repository = "https://github.com/trunkszi/grpc-rs"

[workspace.dependencies]
zstd = { version = "0.13" }
lz4_flex = { version = "0.11" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
snap = { version = "1" }
base64 = { version = "0.22" }
grpc-core = { path = "crates/grpc-core" }
grpc-codec-prost = { path = "crates/grpc-codec/prost" }
grpc-codec-fory = { path = "crates/grpc-codec/fory" }
grpc-codec-capnp = { path = "crates/grpc-codec/capnp" }
grpc-macros = { path = "crates/grpc-macros" }
nghttp2 = { git = "https://github.com/trunkszi/nghttp2-rs.git", branch = "main" }
fory = { git = "https://github.com/apache/fory.git", branch = "main" }
prost = { version = "0.14", default-features = false, features = ["std"] }
capnp = { version = "0.25", default-features = false, features = ["std", "alloc"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
clone_on_copy = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
unnecessary_to_owned = "deny"
cloned_instead_of_copied = "deny"
inefficient_to_string = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
expl_impl_clone_on_copy = "deny"
non_canonical_clone_impl = "deny"
useless_conversion = "deny"
useless_asref = "deny"
to_string_in_format_args = "deny"
manual_string_new = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"

# Dev profile: 关闭无用的完整 DWARF 调试段，关闭与 sccache 冲突的 incremental
[profile.dev]
opt-level = 0
debug = false
strip = "debuginfo"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.test]
inherits = "dev"
opt-level = 0
debug = false
strip = "debuginfo"
incremental = false
