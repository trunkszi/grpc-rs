[workspace]
members = [
    "crates/grpc-core",
    "crates/grpc-codec/prost",
    "crates/grpc-codec/fory",
    "crates/grpc-codec/capnp",
    "crates/grpc-macros",
    "crates/grpc-build",
    "crates/grpc",
]
resolver = "3"

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/trunkszi/grpc-rs"

[workspace.dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
liburing = { git = "https://github.com/trunkszi/liburing-rs.git", branch = "main", package = "liburing-proactor" }
libc = { version = "0.2" }
thiserror = { version = "2.0" }
anyhow = { version = "1.0" }
prost-build = { version = "0.14" }
capnpc = { version = "0.25" }
syn = { version = "2", features = ["full", "extra-traits"] }
quote = { version = "1" }
proc-macro2 = { version = "1" }
grpc-build = { version = "0.0.1", path = "crates/grpc-build", package = "grpc-rs-build", default-features = false }
zstd = { version = "0.13" }
lz4_flex = { version = "0.11" }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
snap = { version = "1" }
base64 = { version = "0.22" }
grpc-core = { version = "0.0.1", path = "crates/grpc-core" }
grpc-codec-prost = { version = "0.0.1", path = "crates/grpc-codec/prost" }
grpc-codec-fory = { version = "0.0.1", path = "crates/grpc-codec/fory" }
grpc-codec-capnp = { version = "0.0.1", path = "crates/grpc-codec/capnp" }
grpc-macros = { version = "0.0.1", path = "crates/grpc-macros" }
nexora-proto = { git = "https://github.com/trunkszi/nexora-rs.git", branch = "main" }
socket2 = { version = "0.6", features = ["all"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "crypto"] }
fory = { version = "1.7.7" }
prost = { version = "0.14", default-features = false, features = ["std"] }
capnp = { version = "0.25", default-features = false, features = ["std", "alloc"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
clone_on_copy = "deny"
redundant_clone = "deny"
implicit_clone = "deny"
unnecessary_to_owned = "deny"
cloned_instead_of_copied = "deny"
inefficient_to_string = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
expl_impl_clone_on_copy = "deny"
non_canonical_clone_impl = "deny"
useless_conversion = "deny"
useless_asref = "deny"
to_string_in_format_args = "deny"
manual_string_new = "deny"
let_underscore_must_use = "deny"
todo = "deny"
unimplemented = "deny"

# Dev profile: skip unused full DWARF debug info; incremental conflicts with sccache.
[profile.dev]
opt-level = 0
debug = false
strip = "debuginfo"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.dev.build-override]
debug = false

[profile.test]
inherits = "dev"
opt-level = 0
debug = false
strip = "debuginfo"
incremental = false
