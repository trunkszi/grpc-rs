name: Rust CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  RUST_TEST_THREADS: "1"

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config protobuf-compiler capnproto python3-venv
      - name: Install Apache Fory compiler
        run: |
          python3 -m venv "$RUNNER_TEMP/foryc-venv"
          "$RUNNER_TEMP/foryc-venv/bin/python" -m pip install 'git+https://github.com/apache/fory.git@main#subdirectory=compiler'
          "$RUNNER_TEMP/foryc-venv/bin/foryc" --help
          echo "$RUNNER_TEMP/foryc-venv/bin" >> "$GITHUB_PATH"
          echo "FORYC=$RUNNER_TEMP/foryc-venv/bin/foryc" >> "$GITHUB_ENV"
          echo 'GRPC_BUILD_REQUIRE_FORYC=1' >> "$GITHUB_ENV"
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-gnu, x86_64-unknown-linux-musl
      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: Clippy with all codecs
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test all codecs
        run: cargo test --workspace --all-targets --all-features --locked
