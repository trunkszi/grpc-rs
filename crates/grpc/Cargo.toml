[package]
name = "grpc"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }
publish = { workspace = true }
repository = { workspace = true }

[lints]
workspace = true

[features]
default = ["protobuf"]
protobuf = ["dep:grpc-codec-prost", "dep:prost", "grpc-build/protobuf"]
fory = ["dep:grpc-codec-fory", "dep:fory"]
capnp = ["dep:grpc-codec-capnp", "dep:capnp", "grpc-build/capnp"]

[dependencies]
thiserror = { workspace = true }
prost = { workspace = true, optional = true, features = ["derive"] }
fory = { workspace = true, optional = true }
capnp = { workspace = true, optional = true }
grpc-core = { workspace = true }
grpc-macros = { workspace = true }
grpc-codec-prost = { workspace = true, optional = true }
grpc-codec-fory = { workspace = true, optional = true }
grpc-codec-capnp = { workspace = true, optional = true }

[build-dependencies]
grpc-build = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }

[[example]]
name = "hft_order_service"
required-features = ["protobuf", "fory", "capnp"]

[[bench]]
name = "hft_rpc_bench"
harness = false
required-features = ["protobuf", "fory", "capnp"]
